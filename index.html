<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Việt Nam - Cẩm Nang Kỹ Thuật, Mạch Điện & Review Linh Kiện</title>
    <meta name="description" content="Trang chia sẻ kiến thức kỹ thuật điện tử, hướng dẫn chế đồ DIY, năng lượng mặt trời và review linh kiện chính hãng tốt nhất.">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #2c3e50; margin-bottom: 5px; cursor: pointer; }
        .slogan { color: #666; font-size: 1.1em; }

        /* Thanh Menu danh mục */
        .menu-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .menu-btn { background: #e9ecef; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #495057; transition: all 0.3s; }
        .menu-btn:hover, .menu-btn.active { background: #007bff; color: white; }

        /* Giao diện danh sách bài viết dạng Card (Trang chủ) */
        .article-card { background: white; padding: 20px 25px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .article-card:hover { transform: translateY(-3px); }
        .article-card h2 { color: #1a1a1a; margin-top: 0; font-size: 1.3em; }
        .article-card h2 a { color: inherit; text-decoration: none; }
        .article-card h2 a:hover { color: #007bff; }
        
        /* Giao diện xem chi tiết 1 bài viết */
        .article-detail { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .article-detail h1 { color: #1a1a1a; font-size: 1.8em; text-align: left; }
        .content p { line-height: 1.7; color: #444; margin-bottom: 15px; }

        .meta { display: flex; justify-content: space-between; color: #888; font-size: 0.85em; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .badge { background: #e3f2fd; color: #0d6efd; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        
        /* Nút Đọc tiếp & Quay lại */
        .read-more-btn { display: inline-block; background: #007bff; color: white; padding: 8px 16px; text-decoration: none; border-radius: 5px; font-size: 0.9em; font-weight: bold; margin-top: 10px; }
        .read-more-btn:hover { background: #0056b3; }
        .back-btn { display: inline-block; background: #6c757d; color: white; padding: 8px 16px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-bottom: 20px; }
        .back-btn:hover { background: #5a6268; }

        /* Hashtag */
        .hashtags { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .tag { display: inline-block; background: #f1f3f5; color: #6c757d; padding: 2px 8px; border-radius: 3px; font-size: 0.8em; margin-right: 5px; }

        /* Nút mua hàng Shopee */
        .buy-button { display: inline-block; background-color: #ee4d2d; color: white !important; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; transition: background 0.3s; }
        .buy-button:hover { background-color: #d73d22; }

        #ads-box { margin-bottom: 25px; text-align: center; }
        .loading { text-align: center; color: #666; font-style: italic; font-size: 1.1em; padding: 40px; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="window.location.href='?'">⚡ DIY Việt Nam</h1>
        <div class="slogan">Cẩm Nang Kỹ Thuật, Mạch Điện & Linh Kiện, Reviews Sản Phẩm</div>
    </header>

    <!-- Khung chứa mã Quảng cáo từ Admin -->
    <div id="ads-box"></div>

    <!-- Thanh Menu lọc danh mục (Chỉ hiện ở trang chủ) -->
    <div class="menu-container" id="menu-bar" style="display: none;">
        <button class="menu-btn active" onclick="filterCategory('All', this)">Tất cả bài viết</button>
    </div>
    
    <!-- Nơi hiển thị nội dung chính -->
    <div id="app-container">
        <p class="loading">⏳ Đang tải dữ liệu từ hệ thống...</p>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://mmo-1-a7a47-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allArticlesMap = {}; // Lưu danh sách bài viết dạng key-value để tra cứu khi xem chi tiết

        // 1. Lắng nghe mã Quảng cáo (Ads) từ Admin
        onValue(ref(db, 'settings/ads'), (snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('ads-box').innerHTML = snapshot.val().html_code || '';
            }
        });

        // 2. Lấy dữ liệu bài viết từ Firebase
        const articlesRef = query(ref(db, 'articles'), orderByChild('timestamp'));
        
        onValue(articlesRef, (snapshot) => {
            if (!snapshot.exists()) {
                document.getElementById('app-container').innerHTML = '<p style="text-align:center;">Chưa có bài viết nào. Hãy vào trang Admin để thêm chủ đề!</p>';
                return;
            }

            allArticlesMap = {};
            const categoriesSet = new Set();
            const articlesList = [];

            snapshot.forEach((childSnapshot) => {
                const key = childSnapshot.key; // ID duy nhất của bài viết trên Firebase
                const article = childSnapshot.val();
                article.id = key;
                
                allArticlesMap[key] = article;
                articlesList.push(article);
                if (article.category) categoriesSet.add(article.category);
            });

            articlesList.reverse(); // Bài mới nhất lên đầu

            // Kiểm tra xem người dùng đang xem trang chủ hay đang bấm vào một bài viết cụ thể qua đường dẫn ?id=...
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (articleId && allArticlesMap[articleId]) {
                // Hiển thị giao diện CHI TIẾT 1 bài viết
                renderArticleDetail(allArticlesMap[articleId]);
            } else {
                // Hiển thị giao diện TRANG CHỦ (Danh sách các Card)
                document.getElementById('menu-bar').style.display = 'flex';
                renderMenu(categoriesSet);
                renderHomeList(articlesList);
            }
        });

        // Vẽ thanh Menu danh mục
        function renderMenu(categories) {
            const menuBar = document.getElementById('menu-bar');
            menuBar.innerHTML = `<button class="menu-btn active" onclick="filterCategory('All', this)">Tất cả bài viết</button>`;
            categories.forEach(cat => {
                menuBar.innerHTML += `<button class="menu-btn" onclick="filterCategory('${cat}', this)">${cat}</button>`;
            });
        }

        // Lọc danh mục
        window.filterCategory = function(category, btnElement) {
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const urlParams = new URLSearchParams(window.location.search);
            // Lấy lại danh sách từ Firebase hoặc xử lý ẩn hiện card
            const cards = document.querySelectorAll('.article-card');
            cards.forEach(card => {
                if (category === 'All' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // 3. Render danh sách trang chủ (Dạng thẻ Card gọn gàng)
        function renderHomeList(articles) {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            articles.forEach(article => {
                const date = new Date(article.timestamp).toLocaleString('vi-VN');
                const cardDiv = document.createElement('div');
                cardDiv.className = 'article-card';
                cardDiv.dataset.category = article.category || 'Tổng hợp';

                cardDiv.innerHTML = `
                    <div class="meta">
                        <span class="badge">${article.category || 'Tổng hợp'}</span>
                        <span>🕒 ${date}</span>
                    </div>
                    <h2><a href="?id=${article.id}">${article.title || 'Bài viết kỹ thuật'}</a></h2>
                    <a href="?id=${article.id}" class="read-more-btn">Đọc tiếp &rarr;</a>
                `;
                container.appendChild(cardDiv);
            });
        }

        // 4. Render giao diện chi tiết một bài viết khi có ?id=...
        function renderArticleDetail(article) {
            document.getElementById('menu-bar').style.display = 'none'; // Ẩn menu ở trang chi tiết
            const container = document.getElementById('app-container');
            
            const date = new Date(article.timestamp).toLocaleString('vi-VN');
            
            let tagsHtml = '';
            if (article.hashtags && Array.isArray(article.hashtags)) {
                tagsHtml = `<div class="hashtags">` + article.hashtags.map(tag => `<span class="tag">${tag}</span>`).join('') + `</div>`;
            }

            let buttonHtml = '';
            if (article.shopee_link) {
                buttonHtml = `<div><a href="${article.shopee_link}" target="_blank" class="buy-button">🛒 Mua Sản Phẩm / Xem Giá Ưu Đãi trên Shopee</a></div>`;
            }

            container.innerHTML = `
                <a href="?" class="back-btn">&larr; Quay lại trang chủ</a>
                <div class="article-detail">
                    <h1>${article.title}</h1>
                    <div class="meta">
                        <span class="badge">${article.category || 'Tổng hợp'}</span>
                        <span>🕒 Cập nhật: ${date}</span>
                    </div>
                    <div class="content">${article.content || ''}</div>
                    ${buttonHtml}
                    ${tagsHtml}
                </div>
            `;
        }
    </script>
</body>
</html>
