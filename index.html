<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Việt Nam - Cẩm Nang Kỹ Thuật, Mạch Điện & Review Linh Kiện</title>
    <meta name="description" content="Trang chia sẻ kiến thức kỹ thuật điện tử, hướng dẫn chế đồ DIY, năng lượng mặt trời và review linh kiện chính hãng tốt nhất.">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .slogan { color: #666; font-size: 1.1em; }

        /* Thanh Menu danh mục */
        .menu-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .menu-btn { background: #e9ecef; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #495057; transition: all 0.3s; }
        .menu-btn:hover, .menu-btn.active { background: #007bff; color: white; }

        /* Khung bài viết */
        .article { background: white; padding: 25px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .article h2 { color: #1a1a1a; margin-top: 0; font-size: 1.4em; }
        .meta { display: flex; justify-content: space-between; color: #888; font-size: 0.85em; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .badge { background: #e3f2fd; color: #0d6efd; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .content p { line-height: 1.6; color: #444; }
        
        /* Hashtag */
        .hashtags { margin-top: 15px; }
        .tag { display: inline-block; background: #f1f3f5; color: #6c757d; padding: 2px 8px; border-radius: 3px; font-size: 0.8em; margin-right: 5px; }

        /* Nút mua hàng Shopee do AI sinh ra */
        .buy-button { display: inline-block; background-color: #ee4d2d; color: white !important; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px; transition: background 0.3s; }
        .buy-button:hover { background-color: #d73d22; }

        /* Khung chứa mã Quảng cáo từ Admin */
        #ads-box { margin-bottom: 25px; text-align: center; }
        .loading { text-align: center; color: #666; font-style: italic; font-size: 1.1em; padding: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ DIY Việt Nam</h1>
        <div class="slogan">Cẩm Nang Kỹ Thuật, Mạch Điện & Review Linh Kiện</div>
    </header>

    <!-- Khu vực hiển thị mã Quảng cáo từ Admin -->
    <div id="ads-box"></div>

    <!-- Thanh Menu lọc danh mục tự động -->
    <div class="menu-container" id="menu-bar">
        <button class="menu-btn active" onclick="filterCategory('All', this)">Tất cả bài viết</button>
    </div>
    
    <!-- Danh sách bài viết -->
    <div id="news-container">
        <p class="loading">⏳ Đang tải dữ liệu từ hệ thống...</p>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        // THAY ĐƯỜNG LINK DATABASE CỦA BẠN VÀO ĐÂY
        const firebaseConfig = {
            databaseURL: "https://mmo-1-a7a47-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allArticles = []; // Biến lưu toàn bộ bài viết để phục vụ việc lọc danh mục

        // 1. Lắng nghe và hiển thị mã Quảng cáo (Ads) từ Admin
        onValue(ref(db, 'settings/ads'), (snapshot) => {
            if (snapshot.exists()) {
                const adsData = snapshot.val();
                document.getElementById('ads-box').innerHTML = adsData.html_code || '';
            }
        });

        // 2. Lấy toàn bộ bài viết từ nhánh 'articles'
        const articlesRef = query(ref(db, 'articles'), orderByChild('timestamp'));
        
        onValue(articlesRef, (snapshot) => {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align:center;">Chưa có bài viết nào. Hãy vào trang Admin để thêm chủ đề cho Bot viết nhé!</p>';
                return;
            }

            allArticles = [];
            const categoriesSet = new Set();

            snapshot.forEach((childSnapshot) => {
                const article = childSnapshot.val();
                allArticles.push(article);
                if (article.category) {
                    categoriesSet.add(article.category);
                }
            });

            // Đảo ngược để bài mới nhất lên đầu
            allArticles.reverse();

            // Vẽ lại thanh Menu danh mục động
            renderMenu(categoriesSet);

            // Hiển thị toàn bộ bài viết ban đầu
            displayArticles(allArticles);
        });

        // Hàm tạo các nút bấm Menu danh mục
        function renderMenu(categories) {
            const menuBar = document.getElementById('menu-bar');
            // Giữ lại nút "Tất cả" đầu tiên, xóa các nút cũ phía sau tránh bị lặp
            menuBar.innerHTML = `<button class="menu-btn active" onclick="filterCategory('All', this)">Tất cả bài viết</button>`;
            
            categories.forEach(cat => {
                menuBar.innerHTML += `<button class="menu-btn" onclick="filterCategory('${cat}', this)">${cat}</button>`;
            });
        }

        // Hàm lọc bài viết khi người dùng bấm vào Menu
        window.filterCategory = function(category, btnElement) {
            // Đổi hiệu ứng sáng (active) cho nút được bấm
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'All') {
                displayArticles(allArticles);
            } else {
                const filtered = allArticles.filter(a => a.category === category);
                displayArticles(filtered);
            }
        }

        // Hàm render danh sách bài viết ra giao diện HTML
       // Hàm render danh sách bài viết ra giao diện HTML
function displayArticles(articles) {
    const container = document.getElementById('news-container');
    container.innerHTML = '';

    if (articles.length === 0) {
        container.innerHTML = '<p style="text-align:center;">Không có bài viết nào trong danh mục này.</p>';
        return;
    }

    articles.forEach(article => {
        const date = new Date(article.timestamp).toLocaleString('vi-VN');
        
        // Xử lý hiển thị Hashtag
        let tagsHtml = '';
        if (article.hashtags && Array.isArray(article.hashtags)) {
            tagsHtml = `<div class="hashtags">` + article.hashtags.map(tag => `<span class="tag">${tag}</span>`).join('') + `</div>`;
        }

        // Tự động tạo nút Shopee chuẩn xác 100% dựa vào link bạn nhập từ Admin
        let buttonHtml = '';
        if (article.shopee_link) {
            buttonHtml = `<div style="margin-top: 20px;"><a href="${article.shopee_link}" target="_blank" class="buy-button">🛒 Mua Sản Phẩm / Xem Giá Ưu Đãi trên Shopee</a></div>`;
        }

        const articleDiv = document.createElement('div');
        articleDiv.className = 'article';
        
        articleDiv.innerHTML = `
            <h2>${article.title || 'Bài viết kỹ thuật'}</h2>
            <div class="meta">
                <span class="badge">${article.category || 'Tổng hợp'}</span>
                <span>🕒 ${date}</span>
            </div>
            <div class="content">${article.content || ''}</div>
            ${buttonHtml}
            ${tagsHtml}
        `;
        
        container.appendChild(articleDiv);
    });
}
    </script>
</body>
</html>
