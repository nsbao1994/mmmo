<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Việc Làm Kỹ Thuật - DIY Việt Nam</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2099/2099058.png" type="image/png">
    <style>
        :root { --primary-color: #0066cc; --accent-color: #ee4d2d; --bg-color: #f4f6f9; --text-color: #333; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background-color: var(--bg-color); color: var(--text-color); }
        
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 30px 20px; border-radius: 12px; text-align: center; margin-bottom: 30px; }
        h1 { margin: 0 0 10px 0; font-size: 2em; cursor: pointer; }
        .slogan { font-size: 1.05em; opacity: 0.9; }

        .nav-menu { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .nav-menu a { padding: 10px 20px; background: white; border: 1px solid #ddd; border-radius: 20px; text-decoration: none; color: #555; font-weight: bold; transition: 0.3s; }
        .nav-menu a:hover { background: #f0f0f0; }
        .nav-menu a.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .page-layout { display: grid; grid-template-columns: 2.2fr 1fr; gap: 30px; align-items: start; }
        
        /* --- CSS THANH TÌM KIẾM --- */
        .search-container { display: flex; gap: 10px; margin-bottom: 25px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .search-container input { flex-grow: 1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 25px; font-size: 1.05em; outline: none; transition: 0.3s; font-family: inherit; }
        .search-container input:focus { border-color: var(--primary-color); box-shadow: 0 0 8px rgba(0,102,204,0.2); }
        .search-container button { background: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; font-size: 1em; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .search-container button:hover { background: #0052a3; transform: translateY(-2px); }

        .jobs-container { display: flex; flex-direction: column; gap: 30px; }
        
        .job-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-top: 5px solid var(--primary-color); display: flex; flex-direction: column; gap: 18px; }
        
        .job-header { display: flex; flex-direction: column; gap: 12px; }
        .job-title { color: var(--primary-color); font-size: 1.6em; margin: 0; line-height: 1.4; }
        
        .job-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.95em; color: #555; }
        .job-meta span { background: #f1f3f5; padding: 6px 12px; border-radius: 6px; font-weight: 600; }
        .job-salary { color: var(--accent-color) !important; font-weight: bold; }
        
        .job-image { width: 100%; border-radius: 8px; overflow: hidden; background: #f0f2f5; display: flex; justify-content: center; align-items: center; padding: 10px; box-sizing: border-box; }
        .job-image img { width: 100%; height: auto; max-height: 750px; object-fit: contain; border-radius: 4px; }
        
        .job-body { display: flex; flex-direction: column; gap: 15px; }
        .job-desc { white-space: pre-wrap; line-height: 1.7; color: #333; font-size: 1.05em; background: #fafbfc; padding: 20px; border-radius: 8px; border: 1px dashed #ccc; }
        .contact-box { background: #e3f2fd; padding: 15px; border-radius: 8px; border: 1px solid #b6e0fe; font-weight: bold; color: #0056b3; display: inline-block; font-size: 1.1em; text-align: center; }
        
        .share-box-job { margin-top: 5px; padding-top: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; width: 100%; }
        .share-btn-job { padding: 8px 16px; border-radius: 6px; color: white; text-decoration: none; font-size: 0.95em; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; transition: opacity 0.2s; }
        .share-btn-job:hover { opacity: 0.85; }
        .fb-share { background: #1877f2; }
        .zalo-share { background: #0068ff; }
        .copy-share { background: #6c757d; }
        .detail-btn { background: var(--primary-color); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.95em; font-weight: 600; margin-left: auto; transition: 0.2s; }
        .detail-btn:hover { background: #0052a3; }

        .sidebar { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); position: sticky; top: 20px; }
        .sidebar-title { font-size: 1.25em; color: var(--accent-color); border-bottom: 2px dashed #eee; padding-bottom: 12px; margin-top: 0; margin-bottom: 20px; }
        .suggested-articles { display: flex; flex-direction: column; gap: 18px; }
        .sugg-card { display: flex; gap: 12px; text-decoration: none; color: #333; align-items: center; transition: 0.2s; }
        .sugg-card:hover { transform: translateX(5px); color: var(--primary-color); }
        .sugg-img { width: 85px; height: 65px; border-radius: 6px; object-fit: cover; background: #eee; flex-shrink: 0; }
        .sugg-title { font-size: 1em; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .loading { text-align: center; color: #666; font-style: italic; padding: 40px; }

        @media (max-width: 800px) {
            .page-layout { grid-template-columns: 1fr; } 
            .detail-btn { margin-left: 0; width: 100%; text-align: center; margin-top: 10px; }
            .share-box-job { flex-direction: column; align-items: stretch; text-align: center; }
            .search-container { flex-direction: column; }
            .search-container button { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="window.location.href='index.html'">⚡ DIY Việt Nam</h1>
        <div class="slogan">Kênh việc làm</div>
    </header>

    <div class="nav-menu">
        <a href="index.html">📖 Đọc Blog Mẹo Vặt</a>
        <a href="jobs.html" class="active">💼 Việc Làm </a>
    </div>

    <div class="page-layout">
        <!-- Khối bên trái: Tìm kiếm & Danh sách Việc làm -->
        <div>
            <!-- THANH TÌM KIẾM -->
            <div class="search-container" id="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Nhập vị trí, công ty hoặc khu vực (VD: Hà Nội)...">
                <button id="searchBtn">Tìm Kiếm</button>
            </div>

            <div id="jobs-list" class="jobs-container">
                <p class="loading">⏳ Đang tải tin tuyển dụng...</p>
            </div>
        </div>
        
        <!-- Khối bên phải: Bài viết Đề xuất -->
        <div class="sidebar">
            <h3 class="sidebar-title">🔥 Có thể bạn quan tâm</h3>
            <div id="sidebar-articles" class="suggested-articles">
                <p style="font-size: 14px; color: #888;">Đang tải bài viết...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://mmo-1-a7a47-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalJobsArray = []; // Lưu trữ toàn bộ công việc để tìm kiếm

        // 1. TẢI DANH SÁCH VIỆC LÀM
        const jobsRef = query(ref(db, 'jobs'), orderByChild('timestamp'));
        onValue(jobsRef, (snapshot) => {
            const container = document.getElementById('jobs-list');
            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align:center; padding: 30px; background:white; border-radius:8px;">Hiện chưa có tin tuyển dụng nào.</p>';
                return;
            }

            let jobsArray = [];
            snapshot.forEach((child) => { 
                let jobData = child.val();
                jobData.id = child.key;
                jobsArray.push(jobData); 
            });
            jobsArray.reverse(); 
            globalJobsArray = jobsArray; // Đẩy vào mảng toàn cục
            
            const urlParams = new URLSearchParams(window.location.search);
            const targetJobId = urlParams.get('id');

            // NẾU ĐANG XEM CHI TIẾT 1 CÔNG VIỆC CỤ THỂ
            if (targetJobId) {
                document.getElementById('search-box').style.display = 'none'; // Giấu thanh tìm kiếm đi
                
                const specificJob = jobsArray.find(j => j.id === targetJobId);
                let html = '';
                if (specificJob) {
                    html += `<a href="jobs.html" style="display:inline-block; margin-bottom:15px; text-decoration:none; color:#0066cc; font-weight:bold; background: white; padding: 10px 20px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">&larr; Xem tất cả Việc làm</a>`;
                    html += renderJobCard(specificJob, true);
                } else {
                    html += `<p style="text-align:center; color:red;">Tin tuyển dụng này không tồn tại hoặc đã bị xóa.</p><a href="jobs.html">Quay lại</a>`;
                }
                container.innerHTML = html;
            } 
            // NẾU ĐANG Ở TRANG DANH SÁCH TỔNG
            else {
                renderJobList(globalJobsArray);
            }
        });

        // HÀM RENDER DANH SÁCH (HỖ TRỢ TÌM KIẾM)
        function renderJobList(arrayToRender) {
            const container = document.getElementById('jobs-list');
            let html = '';
            
            if (arrayToRender.length === 0) {
                html = '<p style="text-align:center; padding: 30px; background:white; border-radius:8px; color:#ee4d2d; font-weight:bold;">Không tìm thấy công việc nào phù hợp với từ khóa của bạn.</p>';
            } else {
                arrayToRender.forEach(job => {
                    html += renderJobCard(job, false);
                });
            }
            container.innerHTML = html;
        }

        // BỘ LỌC TÌM KIẾM THEO THỜI GIAN THỰC (REAL-TIME)
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        function performSearch() {
            const keyword = searchInput.value.toLowerCase().trim();
            
            if (!keyword) {
                renderJobList(globalJobsArray); // Nếu ô tìm kiếm trống, hiện tất cả
                return;
            }
            
            const filteredJobs = globalJobsArray.filter(job => {
                const titleMatch = (job.title || '').toLowerCase().includes(keyword);
                const companyMatch = (job.company || '').toLowerCase().includes(keyword);
                const locationMatch = (job.location || '').toLowerCase().includes(keyword);
                const categoryMatch = (job.category || '').toLowerCase().includes(keyword);
                // Trả về TRUE nếu từ khóa xuất hiện ở 1 trong 3 trường trên
                return titleMatch || companyMatch || locationMatch;
            });
            
            renderJobList(filteredJobs);
        }

        // Lắng nghe sự kiện gõ phím (Lọc ngay khi đang gõ)
        searchInput.addEventListener('input', performSearch);
        // Lắng nghe sự kiện bấm nút Tìm Kiếm
        searchBtn.addEventListener('click', performSearch);


        // HÀM TẠO GIAO DIỆN CÔNG VIỆC KIỂU BẢNG TIN
        function renderJobCard(job, isDetailView) {
            const date = new Date(job.timestamp).toLocaleDateString('vi-VN');
            const imgSrc = job.image ? job.image : "https://cdn-icons-png.flaticon.com/512/3281/3281289.png";
            const categoryBadge = job.category ? `<span style="background: #e9ecef; color: #495057;">🏷️ ${job.category}</span>` : '';
            const shareApiUrl = window.location.origin + '/api/share_job?id=' + job.id;
            
            const shareHtml = `
                <div class="share-box-job">
                    <span style="font-size: 1em; font-weight: bold; color: #555;">📢 Chia sẻ:</span>
                    <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareApiUrl)}" target="_blank" class="share-btn-job fb-share">Facebook</a>
                    <a href="https://zalo.me/share?url=${encodeURIComponent(shareApiUrl)}" target="_blank" class="share-btn-job zalo-share">Zalo</a>
                    <button onclick="navigator.clipboard.writeText('${shareApiUrl}'); alert('Đã sao chép link công việc!');" class="share-btn-job copy-share">📋 Copy Link</button>
                    ${!isDetailView ? `<a href="?id=${job.id}" class="detail-btn">Xem chi tiết &rarr;</a>` : ''}
                </div>
            `;

            return `
                <div class="job-card">
                    <div class="job-header">
                        <h2 class="job-title"><a href="?id=${job.id}" style="color: inherit; text-decoration: none;">${job.title}</a></h2>
                        <div class="job-meta">
                        ${categoryBadge} <!-- Hiển thị thẻ Ngành nghề ở đây -->
                            <span>🏢 ${job.company || 'Bảo mật thông tin'}</span>
                            <span>📍 ${job.location || 'Chưa cập nhật'}</span>
                            <span class="job-salary">💰 ${job.salary || 'Thỏa thuận'}</span>
                            <span>🕒 Đăng ngày: ${date}</span>
                        </div>
                    </div>
                    
                    <div class="job-image">
                        <a href="?id=${job.id}" style="display:block; width:100%; text-align:center;">
                            <img src="${imgSrc}" alt="${job.company}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3281/3281289.png'">
                        </a>
                    </div>
                    
                    <div class="job-body">
                        <div class="job-desc">${job.description || 'Không có mô tả thêm.'}</div>
                        <div class="contact-box">
                            📞 Liên hệ ứng tuyển: <span style="user-select: all;">${job.contact}</span>
                        </div>
                    </div>
                    
                    ${shareHtml}
                </div>
            `;
        }

        // 2. TẢI BÀI VIẾT ĐỀ XUẤT
        const articlesRef = query(ref(db, 'articles'), orderByChild('timestamp'), limitToLast(6));
        onValue(articlesRef, (snapshot) => {
            const sidebar = document.getElementById('sidebar-articles');
            if (!snapshot.exists()) return;
            
            let articlesArray = [];
            snapshot.forEach((child) => { 
                let data = child.val();
                data.id = child.key;
                articlesArray.push(data); 
            });
            articlesArray.reverse();
            
            let suggHtml = '';
            articlesArray.forEach(a => {
                const promptText = a.image_prompt || a.title || 'technology';
                const aiImageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=150&height=150&nologo=true`;
                const finalImageUrl = a.custom_img ? a.custom_img : aiImageUrl;
                
                suggHtml += `
                    <a href="/index.html?id=${a.id}" class="sugg-card">
                        <img src="${finalImageUrl}" class="sugg-img" onerror="this.src='https://picsum.photos/seed/${a.id}/150/150'">
                        <div class="sugg-title">${a.title}</div>
                    </a>
                `;
            });
            sidebar.innerHTML = suggHtml;
        });
    </script>
</body>
</html>
