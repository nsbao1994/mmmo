<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Việc Làm Kỹ Thuật - DIY Việt Nam</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2099/2099058.png" type="image/png">
    <style>
        :root { --primary-color: #0066cc; --accent-color: #ee4d2d; --bg-color: #f4f6f9; --text-color: #333; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: var(--bg-color); color: var(--text-color); }
        
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 30px 20px; border-radius: 12px; text-align: center; margin-bottom: 30px; }
        h1 { margin: 0 0 10px 0; font-size: 2em; cursor: pointer; }
        .slogan { font-size: 1.05em; opacity: 0.9; }

        .nav-menu { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .nav-menu a { padding: 10px 20px; background: white; border: 1px solid #ddd; border-radius: 20px; text-decoration: none; color: #555; font-weight: bold; transition: 0.3s; }
        .nav-menu a:hover { background: #f0f0f0; }
        .nav-menu a.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .jobs-container { display: flex; flex-direction: column; gap: 20px; }
        .job-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid var(--primary-color); }
        .job-title { color: var(--primary-color); font-size: 1.4em; margin: 0 0 10px 0; }
        .job-meta { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; font-size: 0.95em; color: #555; }
        .job-meta span { background: #f1f3f5; padding: 5px 10px; border-radius: 5px; font-weight: 500; }
        .job-salary { color: var(--accent-color) !important; font-weight: bold; }
        
        .job-desc { white-space: pre-wrap; line-height: 1.6; color: #444; margin-bottom: 20px; background: #fafbfc; padding: 15px; border-radius: 6px; border: 1px dashed #ccc; }
        
        .contact-box { background: #e3f2fd; padding: 15px; border-radius: 6px; border: 1px solid #b6e0fe; font-weight: bold; color: #0056b3; display: inline-block; }
        
        .loading { text-align: center; color: #666; font-style: italic; padding: 40px; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            header { padding: 20px 15px; }
            h1 { font-size: 1.5em; }
            .job-meta { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="window.location.href='index.html'">⚡ DIY Việt Nam</h1>
        <div class="slogan">Kênh việc làm Kỹ thuật & Công nghệ</div>
    </header>

    <div class="nav-menu">
        <a href="index.html">📖 Đọc Blog Mẹo Vặt</a>
        <a href="jobs.html" class="active">💼 Việc Làm Kỹ Thuật</a>
    </div>

    <div id="jobs-list" class="jobs-container">
        <p class="loading">⏳ Đang tải tin tuyển dụng...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://mmo-1-a7a47-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const jobsRef = query(ref(db, 'jobs'), orderByChild('timestamp'));

        onValue(jobsRef, (snapshot) => {
            const container = document.getElementById('jobs-list');
            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align:center;">Hiện chưa có tin tuyển dụng nào.</p>';
                return;
            }

            let jobsArray = [];
            snapshot.forEach((childSnapshot) => {
                jobsArray.push(childSnapshot.val());
            });
            
            // Đảo ngược để việc làm mới nhất lên đầu
            jobsArray.reverse();
            
            let html = '';
            jobsArray.forEach(job => {
                const date = new Date(job.timestamp).toLocaleDateString('vi-VN');
                html += `
                    <div class="job-card">
                        <h2 class="job-title">${job.title}</h2>
                        <div class="job-meta">
                            <span>🏢 ${job.company || 'Bảo mật thông tin'}</span>
                            <span>📍 ${job.location || 'Chưa cập nhật'}</span>
                            <span class="job-salary">💰 ${job.salary || 'Thỏa thuận'}</span>
                            <span>🕒 Đăng ngày: ${date}</span>
                        </div>
                        <div class="job-desc">${job.description || 'Không có mô tả thêm.'}</div>
                        <div class="contact-box">
                            📞 Liên hệ ứng tuyển: ${job.contact}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        });
    </script>
</body>
</html>
